version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-devops-frontend
    ports:
      - "8501:8501"
    environment:
      # Service URLs
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8001}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://rag-service:8002}
      - MCP_SERVICE_URL=${MCP_SERVICE_URL:-http://mcp-service:8003}
      - INFRA_SERVICE_URL=${INFRA_SERVICE_URL:-http://infra-service:8004}
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Restart policy
    restart: unless-stopped
    
    # Network
    networks:
      - ai-devops-network

networks:
  ai-devops-network:
    driver: bridge
