version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - ai-devops-network
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "8002:8002"
    environment:
      # Required: Add your Anthropic API key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Service configuration
      - SERVICE_NAME=rag-service
      - SERVICE_PORT=8002
      - DEBUG=false
      
      # Qdrant configuration
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      
      # Search configuration
      - DEFAULT_SEARCH_RESULTS=5
      - MAX_SEARCH_RESULTS=20
      
      # Other microservices URLs
      - AI_SERVICE_URL=http://ai-service:8001
      - MCP_SERVICE_URL=http://mcp-service:8003
      - INFRA_SERVICE_URL=http://infra-service:8004
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    
    depends_on:
      - qdrant
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Network
    networks:
      - ai-devops-network

volumes:
  qdrant-data:
    driver: local

networks:
  ai-devops-network:
    driver: bridge